# ============================================================================
# 분석 규칙 설정 (config/rules.yaml)
# 코드에는 어떤 임계값/날짜/키워드도 하드코딩하지 않으며, 전부 이 파일에서 읽습니다.
# ============================================================================

# 분석 시작일: 이 날짜 이전 이력은 "읽기는" 하되 판정에는 사용하지 않습니다.
# (항목×호기별 첫 교체일 = 기준점 탐색도 이 날짜 이후부터 시작)
analysis_start: 2026-09-01

# 생산일 귀속 기준 시각(교대 기준). SMES 발생일자와 동일한 08:00 기준입니다.
# 생산팀 엑셀의 '야' 행도 같은 생산일(주간과 동일 날짜)로 귀속합니다.
shift_boundary_hour: 8

# 등급별 허용오차(일). ★ 가정값 — 확정 전 ★
# 예상교체일 ± 허용오차 범위 안에 실제교체일이 들어오면 '정시'로 봅니다.
tolerance_days:
  A: 2
  B: 3
  C: 5

# 마스터의 '교체 주기(일)'는 "3년 이력 최소주기 × 70% 가혹조건"으로 산출된
# 상한(최소 교체 일정)입니다. 늦어도 이 주기 안에는 교체해야 합니다.
# 따라서 예상일보다 '조기'에 교체한 것은 (과잉교체 모니터링 대상이긴 하나) 준수로 집계합니다.
early_counts_as_compliant: true

# 두 출처(생산팀/전산) 병합 허용 범위(일). 같은 (호기, 항목)이 ±N일 이내면 1건으로 병합.
merge_window_days: 1

# 데이터 커버리지 경고 임계(일): 두 출처의 데이터 종료일이 이 일수 이상 차이 나면 요약 시트에 경고.
coverage_gap_warn_days: 7

# ----------------------------------------------------------------------------
# 키워드 매칭 방식 (문제 B 결정 반영)
#   token_and: 항목별 토큰(예: 칼날 + 교체)을 "모두 포함"해야 매칭 (공백 무시).
#              수량/방향어(좌측, 2개, 2EA 등)가 토큰 사이에 끼어도 매칭됩니다.
# require_token: 모든 항목에 공통으로 반드시 포함돼야 하는 토큰(교체 행위임을 보증).
# ----------------------------------------------------------------------------
match_mode: token_and
require_token: 교체

# '교체' 단어는 있으나 마스터 34항목 어디에도 매칭되지 않은 조각을 "미매칭" 시트로 보낼 때,
# 애초에 소모품 교체가 아님이 명백한 조각(형명/금형 변경)은 미매칭 시트에서도 제외합니다.
mold_change_markers:
  - 형명
  - 금형
